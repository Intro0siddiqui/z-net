[package]
name = "z-pipeline"
version = "0.1.0"
edition = "2021"

[lib]
name = "z_pipeline"
crate-type = ["staticlib", "cdylib"]
path = "pipeline.rs"

[dependencies]
# Essential async primitives
tokio = { version = "1.0", features = ["sync", "time", "net", "rt"] }

# Auth state machine from the lean_net (rust_net) crate.
lean_net = { path = "../../rust_net" }

# Feature 1: Compression
zstd = { version = "0.13", default-features = false }
brotli = { version = "7.0", default-features = false }
flate2 = { version = "1.0", default-features = false }

# Feature 2: Proxies
socks = "0.3"

# Feature 4: Auth
[target.'cfg(target_os = "windows")'.dependencies.sspi]
version = "0.10"
features = ["tsssp"]

[target.'cfg(not(target_os = "windows"))'.dependencies.libgssapi]
version = "0.8"

base64 = "0.22"

# Removed unused heavy dependencies: reqwest, hyper, prometheus, async-std, clap
# These were identified as binary size bloat.
