[package]
name = "z-pipeline"
version = "0.1.0"
edition = "2021"

[lib]
name = "z_pipeline"
crate-type = ["staticlib", "cdylib"]
path = "pipeline.rs"

[dependencies]
# Essential async primitives
tokio = { version = "1.0", features = ["sync", "time", "net", "rt"] }

# Auth state machine from the lean_net (rust_net) crate.
lean_net = { package = "lean-net", path = "../../rust_net" }

# Feature 1: Compression
zstd = { version = "0.13", default-features = false }
brotli = { version = "7.0", default-features = false, features = ["std"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

# Feature 2: Proxies
socks = "0.3"

# Feature 4: Auth (gated - see lean_net feature flag)
[dependencies.sspi]
version = "0.10"
optional = true
features = ["tsssp"]

[dependencies.libgssapi]
version = "0.8"
optional = true

[dependencies.base64]
version = "0.22"

[features]
default = []
enterprise-auth = ["dep:sspi", "dep:libgssapi", "lean_net/enterprise-auth"]

# Removed unused heavy dependencies: reqwest, hyper, prometheus, async-std, clap
# These were identified as binary size bloat.
