name: CI

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]
  schedule:
    - cron: '0 6 * * *'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust Engine Tests (HTTP/3, WebSockets, Multi-Path QUIC, DoH/DoT, PAC)
        run: |
          cd engine
          cargo test --all-targets -- --nocapture

      - name: Build Rust Backend (Release)
        run: |
          cd engine
          cargo build --release

      - name: Run Zig Tests (no FFI)
        run: zig build test --summary all

      - name: Build Zig (no FFI)
        run: zig build --summary all

      - name: Build Zig (with Rust FFI linked)
        run: zig build -Dznet-link-rust=true --summary all
