[package]
name = "z-net-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
compio-buf = "0.8.3"

[target.'cfg(target_os = "linux")'.dependencies]
compio-driver = { version = "0.12.5", features = ["io-uring", "polling"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
compio-driver = { version = "0.12.5", features = ["polling"] }

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["tls12", "std"]

[dependencies.boring]
version = "5.6"

[dependencies.webpki-roots]
version = "1.0"

[dependencies.log]
version = "0.4"
default-features = false

[dependencies.errno]
version = "0.3"

[dependencies.libc]
version = "0.2"

[dependencies.socket2]
version = "0.6"

[dependencies.httparse]
version = "1.8"

[dependencies.http]
version = "1.0"

[dependencies.h2-sans-io]
version = "0.9.2"

[dependencies.fluke-hpack]
version = "0.3"

[dependencies.quinn-proto]
version = "0.11"
features = ["rustls", "rustls-ring"]

[dependencies.bytes]
version = "1.0"

[dependencies.url]
version = "2.5"

[dependencies.cookie]
version = "0.18"

# Feature 1: Payload Compression Streams
[dependencies.zstd]
version = "0.13"
default-features = false

[dependencies.brotli]
version = "7.0"
default-features = false
features = ["std"]

[dependencies.flate2]
version = "1.0"
default-features = false
features = ["rust_backend"]

# Feature 2: Enterprise Proxy Support
[dependencies.socks]
version = "0.3"

[dependencies.trust-dns-resolver]
version = "0.23"
optional = true

# Feature 4: Advanced Authentication (NTLM / Kerberos / Negotiate)
# System GSSAPI / SSPI is optional. The default build does NOT pull in
# the system libraries, so it compiles on any platform without needing
# libkrb5-dev / MIT Kerberos headers installed. Enable the
# `enterprise-auth` feature to opt in to actual Kerberos AP-REQ /
# Windows SSPI token generation.
[dependencies.sspi]
version = "0.10"
optional = true
features = ["tsssp"]

[dependencies.libgssapi]
version = "0.8"
optional = true

[dependencies.base64]
version = "0.22"

[dependencies.thiserror]
version = "1.0"

[features]
default = ["ring"]
ring = ["rustls/ring"]
# Pulls in sspi (Windows) or libgssapi (POSIX) and turns on the actual
# Kerberos / NTLM challenge-response code path in auth.rs. Requires
# platform-specific system libraries to be installed at build time:
#   * Linux:   apt install libkrb5-dev  (or yum install krb5-devel)
#   * macOS:   ships with the OS, no extra step
#   * Windows: requires the Windows SDK / Heimdal packaging
enterprise-auth = ["dep:sspi", "dep:libgssapi"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
