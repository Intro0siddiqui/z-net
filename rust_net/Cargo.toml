[package]
name = "lean-net"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies.mio]
version = "1.0"
features = ["os-poll", "net"]

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["tls12", "std"]

[dependencies.log]
version = "0.4"
default-features = false

[dependencies.errno]
version = "0.3"

[dependencies.libc]
version = "0.2"

[dependencies.httparse]
version = "1.8"

[dependencies.h2]
version = "0.4"

[dependencies.quinn-proto]
version = "0.11"

[dependencies.url]
version = "2.5"

[dependencies.cookie]
version = "0.18"

# Feature 1: Payload Compression Streams
[dependencies.zstd]
version = "0.13"
default-features = false

[dependencies.brotli]
version = "7.0"
default-features = false

[dependencies.flate2]
version = "1.0"
default-features = false

# Feature 2: Enterprise Proxy Support
[dependencies.socks]
version = "0.3"

[dependencies.trust-dns-resolver]
version = "0.23"
optional = true

# Feature 4: Advanced Authentication (NTLM / Kerberos / Negotiate)
[target.'cfg(target_os = "windows")'.dependencies.sspi]
version = "0.10"
features = ["tsssp"]

[target.'cfg(not(target_os = "windows"))'.dependencies.libgssapi]
version = "0.8"

[dependencies.base64]
version = "0.22"

[dependencies.thiserror]
version = "1.0"

[dependencies.tokio]
version = "1.0"
features = ["sync"]

[features]
default = ["ring"]
ring = ["rustls/ring"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"