[package]
name = "lean-net"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies.mio]
version = "1.0"
features = ["os-poll", "net"]

[dependencies.rustls]
version = "0.23"
default-features = false
features = ["tls12", "std"]

[dependencies.log]
version = "0.4"
default-features = false

[dependencies.errno]
version = "0.3"

[dependencies.libc]
version = "0.2"

[dependencies.httparse]
version = "1.8"

[dependencies.h2]
version = "0.4"

[dependencies.quinn-proto]
version = "0.11"

[dependencies.url]
version = "2.5"

[dependencies.cookie]
version = "0.18"

[features]
default = ["ring"]
ring = ["rustls/ring"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1